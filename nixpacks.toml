[phases.setup]
nixPkgs = ["nodejs_20", "python311"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "cd web && npm ci"
]

[phases.build]
cmds = ["cd web && npm run build"]

# Railway honra el Procfile para el comando de arranque; este [start] se
# mantiene idéntico para que el comportamiento sea el mismo si alguna vez
# se usa nixpacks.toml en lugar del Procfile. Usa $PORT (lo inyecta Railway),
# no el 8000 hardcodeado de "python server.py".
[start]
cmd = "uvicorn server:app --host 0.0.0.0 --port $PORT"
